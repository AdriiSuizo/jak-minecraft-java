# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: installer boundaries
        run: python installer/test_install.py
      - name: packaged documentation links
        run: python tools/test_package_docs.py
      - name: world lifecycle regressions
        run: |
          python tools/test_rescue_lifecycle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/test_dark_eco_lifecycle.py
      - name: native regressions
        # Retail OpenGOAL resources are private. Six explicitly ignored tests
        # run locally with JAKMC_ASSETS and --include-ignored (see DEVELOPMENT).
        run: cargo test --locked --manifest-path native/Cargo.toml
      - name: build
        run: ./gradlew.bat distributionJar
      - name: portable converter
        run: cargo build --release --locked --manifest-path tools/content-exporter/Cargo.toml
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/*-installer-code.jar
