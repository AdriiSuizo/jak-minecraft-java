plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"jakmc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

tasks.register('buildNative', Exec) {
 workingDir 'native'
 commandLine 'cargo', 'build', '--release', '-p', 'jak-jni'
 inputs.files(fileTree('native/jak-core/src'),fileTree('native/jak-jni/src'),file('native/Cargo.toml'),file('native/Cargo.lock'))
 outputs.file('native/target/release/jak_jni.dll')
}
processResources {
 dependsOn 'buildNative'
 from('native/target/release/jak_jni.dll') { into 'natives/windows-x86_64' }
}
loom.runs.configureEach {
 vmArg '--enable-native-access=ALL-UNNAMED'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

sourceSets.main.resources.srcDir('src/generated/resources')

// A source archive contains our adapters/converters, never the private retail
// audio/textures produced in src/generated by the owner's content import.
tasks.named('sourcesJar', Jar) {
 def privateAssets = file('src/generated').toPath().toAbsolutePath().normalize()
 exclude { detail -> detail.file.toPath().toAbsolutePath().normalize().startsWith(privateAssets) }
 from('native') { include 'Cargo.toml','Cargo.lock','jak-core/Cargo.toml','jak-core/src/**','jak-jni/Cargo.toml','jak-jni/src/**' }
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
 from('LICENSE-FABRIC-TEMPLATE')
}

// The downloadable jar contains code only. The installer recreates the ignored
// resources from the player's OpenGOAL installation and merges them locally.
tasks.register('distributionJar', Jar) {
 dependsOn tasks.named('jar')
 archiveClassifier = 'installer-code'
 def privateFiles = provider { fileTree('src/generated/resources').files.collect {
  file('src/generated/resources').toPath().relativize(it.toPath()).toString().replace('\\','/')
 } as Set }
 from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) })
 exclude { privateFiles.get().contains(it.path) }
}


def devWorld = providers.gradleProperty("jakmcDevWorld").orElse("New World (1)")
loom.runs.client {
 vmArg "-Djakmc.devBridge=true"
 // Benchmarks only (tools/run_scene.py --scene bench): extra JVM arguments, e.g. the collector Adrii's install uses.
 (System.getenv("JAKMC_JVM_ARGS") ?: "").split(" ").findAll { it }.each { vmArg it }
 programArgs "--width", "1280", "--height", "720", "--quickPlaySingleplayer", devWorld.get()
}
